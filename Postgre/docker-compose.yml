version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: panel_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: superadmin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: panel_management
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
