version: '3.8'

services:
  postgres:
    build: . 
    container_name: panel_database
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-panel_management}
 
    command: postgres -c shared_preload_libraries='pg_cron' -c cron.database_name='panel_management'

    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: